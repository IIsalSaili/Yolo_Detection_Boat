# YOLO-SEA — Enhanced detection framework for multi-scale maritime targets (Entropy 2025, 27, 667).
# Modifications vs YOLOv8:
#   1. SESA attention block (SENetV2 + SimAM) inserted after the last backbone C2f, before SPPF.
#   2. BiFPN neck with learnable fast-normalized weighted fusion (bidirectional, P3/P4/P5).
# Soft-NMS is a post-processing option (see ultralytics/utils/nms.py, USE_SOFT_NMS) — no retraining.
# Usage:  model = YOLO("yolov8-sea.yaml")   # default scale 'n'; use 'yolov8-sea-s.yaml' style or pass scale

# Parameters
nc: 80 # number of classes
scales: # 'n' and 's' are the supported targets for this project (hardware constraint)
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLO-SEA backbone (YOLOv8 + SESA before SPPF)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4   (P3 source)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6   (P4 source)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8
  - [-1, 1, SESA, []] # 9   SESA attention (channel-preserving, SimAM adds 0 params)
  - [-1, 1, SPPF, [1024, 5]] # 10  (P5 source)

# YOLO-SEA neck — BiFPN with fast normalized weighted fusion (channels unified to 256)
head:
  # ---- project backbone features to a common neck width ----
  - [4, 1, Conv, [256, 1, 1]] # 11  P3_in
  - [6, 1, Conv, [256, 1, 1]] # 12  P4_in
  - [10, 1, Conv, [256, 1, 1]] # 13 P5_in

  # ---- top-down pathway ----
  - [13, 1, nn.Upsample, [None, 2, "nearest"]] # 14  P5 -> P4 scale
  - [[12, 14], 1, BiFPNAdd2, []] # 15  P4 top-down fusion (P4_in + up(P5_in))
  - [-1, 3, C2f, [256]] # 16  P4_td

  - [16, 1, nn.Upsample, [None, 2, "nearest"]] # 17  P4_td -> P3 scale
  - [[11, 17], 1, BiFPNAdd2, []] # 18  P3 fusion (P3_in + up(P4_td))
  - [-1, 3, C2f, [256]] # 19  P3_out (small targets)

  # ---- bottom-up pathway ----
  - [19, 1, Conv, [256, 3, 2]] # 20  P3_out -> P4 scale
  - [[12, 16, 20], 1, BiFPNAdd3, []] # 21  P4 out fusion (skip: P4_in + P4_td + down(P3_out))
  - [-1, 3, C2f, [256]] # 22  P4_out (medium targets)

  - [22, 1, Conv, [256, 3, 2]] # 23  P4_out -> P5 scale
  - [[13, 23], 1, BiFPNAdd2, []] # 24  P5 out fusion (P5_in + down(P4_out))
  - [-1, 3, C2f, [256]] # 25  P5_out (large targets)

  - [[19, 22, 25], 1, Detect, [nc]] # 26  Detect(P3, P4, P5)
